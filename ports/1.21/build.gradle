import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
}

def targets = [
    '1.21.11': [fabricApi: '0.141.6', storage: '2.8.0', litematica: '0.26.16', malilib: '0.27.20',
                mods: ['XZNI4Cpy:FydlCSUl', 'bEpr0Arc:mengBR9D', 'GcWjdA9I:loabWpyU', 'mOgUt4GM:cLkYaVuL']],
    '1.21.10': [fabricApi: '0.138.4', storage: '2.7.0', litematica: '0.24.9', malilib: '0.26.8',
                mods: ['XZNI4Cpy:Gk2tI0ZM', 'bEpr0Arc:c91sTAlP', 'GcWjdA9I:VwmyInJJ', 'mOgUt4GM:pYbFlVtR']],
    '1.21.8': [fabricApi: '0.136.1', storage: '2.6.0', litematica: '0.23.7', malilib: '0.25.7',
               mods: ['XZNI4Cpy:eOUsxNs8', 'bEpr0Arc:GJMDd9Zq', 'GcWjdA9I:2kC79eY3', 'mOgUt4GM:ku5NivOP']],
    '1.21.7': [fabricApi: '0.129.0', storage: '2.6.0', litematica: '0.23.7', malilib: '0.25.7',
               mods: ['XZNI4Cpy:eOUsxNs8', 'bEpr0Arc:GJMDd9Zq', 'GcWjdA9I:2kC79eY3', 'mOgUt4GM:ku5NivOP']],
    '1.21.6': [fabricApi: '0.128.2', storage: '2.4.1', litematica: '0.23.7', malilib: '0.25.7',
               mods: ['XZNI4Cpy:YTzOMaus', 'bEpr0Arc:GJMDd9Zq', 'GcWjdA9I:2kC79eY3', 'mOgUt4GM:ku5NivOP']]
]
def minecraftVersion = providers.gradleProperty('minecraftVersion').getOrElse('1.21.11')
def target = targets[minecraftVersion]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version: $minecraftVersion")
}
def fabricApi = target.fabricApi
def legacyInput = minecraftVersion in ['1.21.6', '1.21.7', '1.21.8']
def loader = '0.19.5'
def storage = target.storage
def litematica = target.litematica
def malilib = target.malilib
def shared = file('../../src/main')
def sharedJava = new File(shared, 'java')
def metadata = new JsonSlurper().parse(new File(shared, 'resources/fabric.mod.json'))
version = metadata.version
layout.buildDirectory = file("../../build/port-$minecraftVersion")

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}+${minecraftVersion}"
    target.mods.each { modImplementation "maven.modrinth:$it" }
}

def versionSpecific = [
    'dev/schematicstock/CompareButton.java',
    'dev/schematicstock/StockScreen.java',
    'dev/schematicstock/TerminalStock.java',
    'dev/schematicstock/TomsmaticModMenu.java',
    'dev/schematicstock/mixin/TerminalScreenMixin.java',
    'dev/schematicstock/refill/RefillPayloadRegistration.java'
] as Set

sourceSets.main {
    java.srcDir sharedJava
    def variant = file(legacyInput ? 'src/1.21.8/java' : "src/$minecraftVersion/java")
    def resourceLocationSources = file('src/resource-location/java')
    def overrides = []
    if (minecraftVersion == '1.21.6') overrides.add(file('src/1.21.6/java'))
    overrides.add(variant)
    if (minecraftVersion != '1.21.11') overrides.add(resourceLocationSources)
    overrides.each { java.srcDir it }
    java.exclude { entry ->
        def override = overrides.find { new File(it, entry.path).isFile() }
        if (override != null) return !entry.file.toPath().startsWith(override.toPath())
        entry.file.toPath().startsWith(sharedJava.toPath()) && versionSpecific.contains(entry.path)
    }
    resources.srcDir new File(shared, 'resources')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    inputs.properties(minecraft: minecraftVersion, fabricApi: fabricApi, loader: loader,
                      storage: storage, litematica: litematica, malilib: malilib)
    filesMatching('tomsmatic.mixins.json') {
        filter { line ->
            def adapted = line.replace('JAVA_25', 'JAVA_21')
            legacyInput ? adapted.replace(', "EasyPlaceRewriteMixin"', '') : adapted
        }
    }
    doLast {
        metadata.depends.putAll(minecraft: minecraftVersion, java: '>=21', fabricloader: ">=$loader",
                                'fabric-api': ">=$fabricApi", toms_storage: storage)
        metadata.suggests.putAll(litematica: litematica, malilib: malilib)
        new File(destinationDir, 'fabric.mod.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
    }
}

tasks.named('remapJar') {
    archiveFileName = "tomsmatic-${version}-${minecraftVersion}.jar"
}
