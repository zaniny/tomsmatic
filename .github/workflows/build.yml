name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile and check the Fabric JAR
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/build.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: tomsmatic
          path: build/release/tomsmatic-*.jar*
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tomsmatic
          path: release
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          version="${GITHUB_REF_NAME#v}"
          sha256sum --check "tomsmatic-$version.jar.sha256"
          gh release create "$GITHUB_REF_NAME" "tomsmatic-$version.jar" "tomsmatic-$version.jar.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Tomsmatic $version" --generate-notes
