name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile and check the Fabric JAR
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          for minecraft in 26.1 26.1.1 26.1.2 26.2 26.3; do
            python3 scripts/build.py --minecraft "$minecraft" "${args[@]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tomsmatic
          path: |
            build/release/tomsmatic-*.jar*
            build/release/tomsmatic-*.md
          if-no-files-found: error

  build-1-21-11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Build the remapped Fabric JAR
        shell: bash
        run: |
          gradle --project-dir ports/1.21.11 build
          cd build/port-1.21.11/libs
          jars=(tomsmatic-*-1.21.11.jar)
          [[ ${#jars[@]} -eq 1 && -f "${jars[0]}" ]]
          sha256sum "${jars[0]}" > "${jars[0]}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tomsmatic-1.21.11
          path: build/port-1.21.11/libs/tomsmatic-*-1.21.11.jar*
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, build-1-21-11]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tomsmatic
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: tomsmatic-1.21.11
          path: release
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          version="${GITHUB_REF_NAME#v}"
          sha256sum --check tomsmatic-"$version"-*.jar.sha256
          gh release create "$GITHUB_REF_NAME" tomsmatic-"$version"-*.jar tomsmatic-"$version"-*.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Tomsmatic $version" --notes-file "tomsmatic-$version.md"
